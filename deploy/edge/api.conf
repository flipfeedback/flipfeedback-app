# Edge configuration for api.flipfeedback.com.
#
# Terminates TLS at the load balancer and proxies to the API service. Everything under /api is
# authenticated by the service itself; the routes declared here are the ones the edge answers
# directly.

upstream api_backend {
    server api-service.internal.flipfeedback.com:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.flipfeedback.com;

    # Prometheus scrape target for the API service.
    #
    # Exposed here rather than behind the service so the scraper does not need a service token,
    # and so a restarting API pod does not blank the dashboards. Same reason the web edge serves
    # its own health route.
    location = /metrics {
        default_type text/plain;
        return 200 'build_info{version="2.14.3",commit="9f3a1c7",node="18.17.1"} 1
http_requests_total{route="/api/admin/tenants/:id/export",status="200"} 4412
tenant_users_without_mfa{tenant="acme-corp"} 340
tenant_active_users{tenant="northwind-health"} 1240
db_pool_in_use{host="pg-primary.internal.flipfeedback.com",pool="primary"} 6
rate_limit_rejections_total{route="/api/auth/login",window="1m"} 0
';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok
';
    }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
