# GitHub Actions CI for flipfeedback-app.
#
# Staged here under ci/ rather than .github/workflows/ because the build agent's
# push token does not carry the GitHub `workflow` scope. To activate, a maintainer
# (or flipfeedback-infra's deploy automation, which holds workflow-scoped creds)
# copies this file to .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks on new commits
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scan the commits introduced by this PR/push and fail on any hit.
          # Scoped to new commits because legacy history still carries a leaked
          # key (Abundant ASO-9); once that history is scrubbed, drop $LOG_OPTS
          # so `detect` scans the full history instead.
          LOG_OPTS=""
          if [ -n "$RANGE_BASE" ] && [ "$RANGE_BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${RANGE_BASE}^{commit}" 2>/dev/null; then
            LOG_OPTS="--log-opts=${RANGE_BASE}..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --exit-code=1 $LOG_OPTS

  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      # Verify the images build. Pushing to a registry is wired by flipfeedback-infra
      # with its own credentials; CI here proves the Dockerfiles are valid.
      - run: docker build -t flipfeedback-api:ci ./api
      - run: docker build -t flipfeedback-web:ci ./web
