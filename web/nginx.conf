server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking protection (finding f572ea6b-7022-489b-bbe8-442806084c31 / FFSCRUM-409).
    # frame-ancestors 'none' is the modern control; X-Frame-Options: DENY covers older browsers.
    # `always` ensures the headers are sent on error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # SPA fallback: every unknown path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    # nginx does not inherit server-level add_header into a location that sets its own,
    # so the security headers above are re-asserted here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
